# Include this file from httpd.conf after loading mod_reqtimeout and, optionally, mod_evasive.
# Example:
# Include conf/extra/uteshop-rate-limit.conf
#
# mod_reqtimeout limits slow HTTP requests.
# mod_evasive is optional and adds simple per-IP burst protection.

<IfModule reqtimeout_module>
    RequestReadTimeout header=10-20,MinRate=500 body=20,MinRate=500
</IfModule>

<IfModule evasive20_module>
    DOSHashTableSize 3097
    DOSPageCount 20
    DOSSiteCount 120
    DOSPageInterval 1
    DOSSiteInterval 1
    DOSBlockingPeriod 60
</IfModule>
