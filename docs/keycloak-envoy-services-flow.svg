<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#047857"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#be123c"/>
    </marker>
    <linearGradient id="boxBlue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="boxGreen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="boxAmber" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, sans-serif; font-size: 17px; fill: #475569; }
      .box-title { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .box-text { font-family: Arial, sans-serif; font-size: 15px; fill: #334155; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #475569; }
      .label { font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #1d4ed8; }
      .green-label { font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #047857; }
      .red-label { font-family: Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #be123c; }
      .box { stroke-width: 2.2; rx: 14; ry: 14; }
      .service { stroke: #0f766e; fill: #f0fdfa; stroke-width: 1.8; rx: 10; ry: 10; }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.4; rx: 10; ry: 10; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="760" fill="#ffffff"/>

  <text x="700" y="52" text-anchor="middle" class="title">OAuth2/OIDC, Envoy Gateway va Keycloak cho UTESHOP</text>
  <text x="700" y="82" text-anchor="middle" class="subtitle">Browser goi API qua Envoy; Envoy/Services xac thuc token voi Keycloak truoc khi xu ly nghiep vu noi bo</text>

  <!-- Main boxes -->
  <rect x="70" y="170" width="245" height="165" class="box" fill="url(#boxBlue)" stroke="#2563eb"/>
  <text x="192" y="208" text-anchor="middle" class="box-title">Browser</text>
  <text x="100" y="244" class="box-text">- Render HTML/JSP</text>
  <text x="100" y="270" class="box-text">- Luu session cookie</text>
  <text x="100" y="296" class="box-text">- Gui Access Token/JWT</text>
  <text x="100" y="322" class="box-text">- Goi API/Checkout/Admin</text>

  <rect x="430" y="155" width="300" height="195" class="box" fill="url(#boxAmber)" stroke="#d97706"/>
  <text x="580" y="194" text-anchor="middle" class="box-title">Envoy API Gateway</text>
  <text x="465" y="232" class="box-text">- Diem vao public cua he thong</text>
  <text x="465" y="258" class="box-text">- Route request den service</text>
  <text x="465" y="284" class="box-text">- Co the validate JWT/JWKS</text>
  <text x="465" y="310" class="box-text">- Rate limit / observability</text>
  <text x="465" y="336" class="box-text">- An service noi bo khoi Internet</text>

  <rect x="870" y="120" width="335" height="205" class="box" fill="url(#boxGreen)" stroke="#059669"/>
  <text x="1038" y="158" text-anchor="middle" class="box-title">Keycloak IdP</text>
  <text x="905" y="198" class="box-text">- Dang nhap SSO</text>
  <text x="905" y="224" class="box-text">- Quan ly user, role, client</text>
  <text x="905" y="250" class="box-text">- Cap Access Token / ID Token</text>
  <text x="905" y="276" class="box-text">- JWKS public key de verify JWT</text>
  <text x="905" y="302" class="box-text">- Co the bat MFA: TOTP/WebAuthn</text>

  <rect x="870" y="420" width="420" height="245" class="box" fill="#f8fafc" stroke="#0f766e"/>
  <text x="1080" y="458" text-anchor="middle" class="box-title">Internal Services</text>

  <rect x="910" y="490" width="155" height="54" class="service"/>
  <text x="988" y="522" text-anchor="middle" class="box-text">catalog-service</text>

  <rect x="1090" y="490" width="155" height="54" class="service"/>
  <text x="1168" y="522" text-anchor="middle" class="box-text">cart-service</text>

  <rect x="910" y="565" width="155" height="54" class="service"/>
  <text x="988" y="597" text-anchor="middle" class="box-text">order-service</text>

  <rect x="1090" y="565" width="155" height="54" class="service"/>
  <text x="1168" y="597" text-anchor="middle" class="box-text">payment-service</text>

  <!-- Arrows -->
  <line x1="315" y1="252" x2="430" y2="252" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
  <text x="372" y="229" text-anchor="middle" class="label">1. HTTPS request</text>
  <text x="372" y="247" text-anchor="middle" class="small">JWT / Cookie / API call</text>

  <path d="M730 220 C785 150, 810 140, 870 170" fill="none" stroke="#047857" stroke-width="3.3" marker-end="url(#arrow-green)"/>
  <text x="790" y="134" text-anchor="middle" class="green-label">2. Lay JWKS / introspect token</text>

  <path d="M870 205 C805 250, 780 280, 730 285" fill="none" stroke="#047857" stroke-width="3.3" marker-end="url(#arrow-green)"/>
  <text x="810" y="302" text-anchor="middle" class="green-label">3. Token hop le / user roles</text>

  <line x1="730" y1="292" x2="870" y2="535" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrow-blue)"/>
  <text x="804" y="424" text-anchor="middle" class="label">4. Route theo path/scope</text>

  <path d="M1038 325 L1038 420" fill="none" stroke="#047857" stroke-width="3.3" marker-end="url(#arrow-green)"/>
  <text x="1065" y="380" class="green-label">Role/Scope</text>

  <path d="M580 350 C580 555, 665 660, 870 620" fill="none" stroke="#be123c" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>
  <text x="655" y="638" class="red-label">Neu token sai hoac thieu quyen: 401/403</text>

  <!-- Notes -->
  <rect x="70" y="440" width="660" height="185" class="note"/>
  <text x="95" y="475" class="box-title">Y nghia bao mat</text>
  <text x="95" y="515" class="box-text">1. Browser khong goi truc tiep service noi bo; moi request di qua Gateway.</text>
  <text x="95" y="543" class="box-text">2. Keycloak dong vai tro Identity Provider tap trung: login, token, role, scope.</text>
  <text x="95" y="571" class="box-text">3. Envoy co the chan request khong hop le truoc khi vao ung dung.</text>
  <text x="95" y="599" class="box-text">4. Services chi xu ly request da duoc xac thuc va co quyen phu hop.</text>

  <rect x="70" y="650" width="1220" height="52" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" rx="10" ry="10"/>
  <text x="90" y="681" class="small">Ghi chu: Trong project hien tai, Envoy va Keycloak da duoc chuan bi trong moi truong Docker production-like. Buoc mo rong tiep theo la gan login Keycloak OIDC va JWT validation tai Gateway/Services.</text>
</svg>
