Listen 443

<VirtualHost *:443>
    ServerName uteshop.kesug.com
    DocumentRoot "C:/Users/nguye/AnToanWeb/infinityfree/htdocs"

    <Directory "C:/Users/nguye/AnToanWeb/infinityfree/htdocs">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off

    # Replace these with the ZeroSSL certificate files for uteshop.kesug.com.
    SSLCertificateFile "${SRVROOT}/conf/ssl/uteshop.kesug.com/certificate.crt"
    SSLCertificateKeyFile "${SRVROOT}/conf/ssl/uteshop.kesug.com/private-key.pem"
    SSLCertificateChainFile "${SRVROOT}/conf/ssl/uteshop.kesug.com/ca_bundle.crt"

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog "${SRVROOT}/logs/uteshop-php-ssl-error.log"
    CustomLog "${SRVROOT}/logs/uteshop-php-ssl-access.log" common
</VirtualHost>

<VirtualHost *:80>
    ServerName uteshop.kesug.com
    DocumentRoot "C:/Users/nguye/AnToanWeb/infinityfree/htdocs"

    <Directory "C:/Users/nguye/AnToanWeb/infinityfree/htdocs">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
