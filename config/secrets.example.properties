# Copy this file to config/secrets.properties for local testing, or let Vault Agent render it.
# Do not commit config/secrets.properties.

DB_URL=jdbc:postgresql://localhost:5432/uteshop
DB_USER=uteshop_app
DB_PASSWORD=change-me
DB_DRIVER=org.postgresql.Driver
HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
HIBERNATE_GLOBALLY_QUOTED_IDENTIFIERS=true
DB_SCHEMA_ACTION=update

GOOGLE_CLIENT_ID=change-me.apps.googleusercontent.com
GOOGLE_CLIENT_SECRET=change-me
GOOGLE_REDIRECT_URI=https://uteshop.kesug.com/uteshop/oauth2/google/callback

# Base64 encoded 16, 24, or 32 byte AES key.
# Example generation:
# [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Maximum 256 }))
FIELD_ENCRYPTION_KEY=change-me

# At least 32 characters for HS256.
JWT_SECRET=change-this-jwt-secret-to-a-long-random-value

SMTP_HOST=smtp.gmail.com
SMTP_PORT=587
SMTP_USERNAME=change-me@gmail.com
SMTP_PASSWORD=change-me
SMTP_FROM=change-me@gmail.com
SMTP_FROM_NAME=UTESHOP Security
SMTP_STARTTLS=true

STRIPE_PUBLISHABLE_KEY=pk_test_change-me
STRIPE_SECRET_KEY=sk_test_change-me
STRIPE_WEBHOOK_SECRET=whsec_change-me
STRIPE_CURRENCY=usd

FORCE_SECURE_COOKIE=true

# Vault Transit KMS. In production, let Vault Agent render these values.
VAULT_ADDR=http://127.0.0.1:8200
VAULT_TOKEN_FILE=C:/secure/uteshop/vault-agent-token
VAULT_TRANSIT_ENABLED=true
VAULT_TRANSIT_KEY=uteshop-field-encryption
