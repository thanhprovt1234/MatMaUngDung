Listen 443

<VirtualHost *:443>
    ServerName uteshop.kesug.com

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off

    # Replace these with the ZeroSSL certificate files for uteshop.kesug.com.
    SSLCertificateFile "${SRVROOT}/conf/ssl/uteshop.kesug.com/certificate.crt"
    SSLCertificateKeyFile "${SRVROOT}/conf/ssl/uteshop.kesug.com/private-key.pem"
    SSLCertificateChainFile "${SRVROOT}/conf/ssl/uteshop.kesug.com/ca_bundle.crt"

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass "/" "http://127.0.0.1:8081/"
    ProxyPassReverse "/" "http://127.0.0.1:8081/"

    ErrorLog "${SRVROOT}/logs/uteshop-ssl-error.log"
    CustomLog "${SRVROOT}/logs/uteshop-ssl-access.log" common
</VirtualHost>

<VirtualHost *:80>
    ServerName uteshop.kesug.com
    Redirect permanent / https://uteshop.kesug.com/
</VirtualHost>
